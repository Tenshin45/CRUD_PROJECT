{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h1 class="display-4 text-center">Create Account</h1>
    <p class="text-center">Create an account to access exclusive features and personalized recommendations.</p>
    {% if form.errors %}
        <div class="alert alert-danger" role="alert">
            Please correct the errors below.
        </div>
    {% endif %}
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="text-center btn btn-primary">Register</button>
    </form>
    <a class="text-center" href="{% url 'login' %}" class="btn btn-link mt-3">Already have an account? Login here</a>
</div>
{% endblock %}
