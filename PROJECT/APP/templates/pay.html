{% extends 'base.html' %}
{% block title %}Home{% endblock %}
{% block content %}
<div class="container">
    {% for product in products %}
    <h1 class="mb-4 text-center">Pay with Mpesa</h1>
    <p class="text-center"></p>
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card p-4 shadow">
                 <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                      <label for="number" class="form-label">Phone Number :</label>
                      <input type="number" id="number" name="number" required class="form-control"></input>
                    </div>
                    <div class="mb-3">
                      <label for="amount" class="form-label">Amount :</label>
                      <input type="number" id="amount" name="amount" required class="form-control" value="{{ product.price }}" readonly></input>
                    </div>
                    <button type="submit" class="btn btn-success btn-block w-100">Make Payement</button>
                </form>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
