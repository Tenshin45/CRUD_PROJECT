{% extends 'base.html' %}

{% block title %}Payment Initiated{% endblock %}

{% block content %}

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow p-4 text-center">

                <h1 class="text-success mb-3">
                    Payment Initiated
                </h1>

                <p class="mb-3">
                    Your M-Pesa payment has been initiated successfully.
                </p>

                <p>
                    Please check your phone and enter your M-Pesa PIN
                    to complete the payment.
                </p>

                <a href="{% url 'user_dashboard' %}" class="btn btn-primary mt-3">
                    Back to Dashboard
                </a>

            </div>
        </div>
    </div>
</div>

{% endblock %}
